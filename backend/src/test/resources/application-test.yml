# Test Configuration for GROCKY Backend
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

# JWT Configuration
jwt:
  secret: TestSecretKeyForTestingPurposesOnly1234567890
  expiration: 3600000  # 1 hour
  refresh-expiration: 7200000  # 2 hours

# Stripe Configuration (test mode)
stripe:
  secret-key: sk_test_mock
  public-key: pk_test_mock

# Disable email in tests
spring:
  mail:
    host: localhost
    port: 0

# Logging
logging:
  level:
    root: WARN
    com.grocky: DEBUG
    org.springframework: WARN
