# Test Configuration for GROCKY Backend
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/grocky_db
    driver-class-name: org.postgresql.Driver
    username: grocky_user
    password: grocky_password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
jwt:
  secret: TestSecretKeyForTestingPurposesOnly1234567890
  expiration: 3600000  # 1 hour
  refresh-expiration: 7200000  # 2 hours

# Stripe Configuration (test mode)
stripe:
  secret-key: sk_test_mock
  public-key: pk_test_mock

# Logging
logging:
  level:
    root: WARN
    com.grocky: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
