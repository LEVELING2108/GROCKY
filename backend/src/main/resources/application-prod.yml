# Production Configuration for GROCKY Backend
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
  
  logging:
    level:
      root: WARN
      com.grocky: INFO
      org.springframework.web: WARN
      org.hibernate.SQL: WARN

# JWT Configuration
jwt:
  expiration: 43200000  # 12 hours
  refresh-expiration: 259200000  # 3 days

# Server Configuration
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/grocky.log
    max-size: 10MB
    max-history: 30
