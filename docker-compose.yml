version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: grocky-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: grocky_db
      POSTGRES_USER: grocky_user
      POSTGRES_PASSWORD: grocky_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocky_user -d grocky_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - grocky-network

  backend:
    build: ./backend
    container_name: grocky-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/grocky_db
      SPRING_DATASOURCE_USERNAME: grocky_user
      SPRING_DATASOURCE_PASSWORD: grocky_password
      JWT_SECRET: ${JWT_SECRET:-GrockySecretKeyForJWTTokenGenerationMustBeLongEnough2024}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_mock_secret_key}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - grocky-network

  frontend:
    build: ./frontend
    container_name: grocky-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - grocky-network

volumes:
  postgres_data:
    name: grocky_postgres_data

networks:
  grocky-network:
    driver: bridge
    name: grocky-network
